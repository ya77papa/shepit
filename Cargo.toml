[workspace]
resolver = "2"
members = ["core", "server", "clients/cli"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/ya77papa/shepit"

[workspace.dependencies]
shepit-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
