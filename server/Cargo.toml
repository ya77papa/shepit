[package]
name = "shepit-server"
description = "Сервер доставки Шепіт: «тупий листоноша» (store-and-forward)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Лише підписи і сертифікати. Модуля шифрування (`crypto`) у сервера немає —
# він фізично не може розшифрувати повідомлення.
shepit-core = { workspace = true, features = ["auth"] }
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = { version = "0.3", default-features = false }
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
rand = "0.9"
# Пароль адміністратора: Argon2id; введення без відлуння в терміналі.
argon2 = "0.5"
rpassword = "7"
# Web Push (сповіщення при закритому застосунку). Потребує OpenSSL, тому окрема фіча:
# Docker-образ збирається з `--features push`; локально на Windows можна без неї.
web-push = { version = "0.11", default-features = false, optional = true }
ureq = { version = "3", optional = true }
p256 = { version = "0.13", optional = true }
http = { version = "0.2", optional = true }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
push = ["dep:web-push", "dep:ureq", "dep:p256", "dep:http"]

[dev-dependencies]
ece = "2.4"
