[package]
name = "shepit-server"
description = "Сервер доставки Шепіт: «тупий листоноша» (store-and-forward)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Лише підписи і сертифікати. Модуля шифрування (`crypto`) у сервера немає —
# він фізично не може розшифрувати повідомлення.
shepit-core = { workspace = true, features = ["auth"] }
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
