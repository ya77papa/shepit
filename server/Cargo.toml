[package]
name = "shepit-server"
description = "Сервер доставки Шепіт: «тупий листоноша» (store-and-forward)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Без криптографії: серверу вона не потрібна, і він не може розшифрувати повідомлення.
shepit-core.workspace = true
serde.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
