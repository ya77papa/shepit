# Запуск на SRV. Образ сервера з'явиться після першої збірки на ПК.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shepit
      POSTGRES_USER: shepit
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data   # на SSD, не на /mnt/music
    mem_limit: 512m

