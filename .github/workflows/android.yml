name: Android

# Збирає APK, підписує ключем із секретів і публікує в GitHub Releases.
# Артефакти Actions не використовуються — вони займають сховище.
on:
  push:
    branches: [main]
    paths:
      - 'clients/android/**'
      - 'clients/android-core/**'
      - 'core/**'
      - 'Cargo.lock'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      # 0.2.N: старі версії застосунку (≤0.1.9) порівнювали теги як текст — «0.2…» для них новіше.
      VERSION_NAME: 0.2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version ^4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK, NDK
        run: |
          SDK="${ANDROID_HOME:-$HOME/android-sdk}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -sSLo /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/clt.zip -d /tmp/clt && rm -rf "$SDK/cmdline-tools/latest" && mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SM" --sdk_root="$SDK" "platform-tools" "build-tools;36.0.0" "platforms;android-37.2" "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4

      - name: Ядро (Rust → .so + Kotlin-біндинги)
        run: bash clients/android/build-core.sh

      - name: Ключ підпису
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.SHEPIT_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Секрет SHEPIT_KEYSTORE_B64 не задано — APK не публікується."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SHEPIT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Збірка APK
        working-directory: clients/android
        env:
          SHEPIT_KEYSTORE_PASSWORD: ${{ secrets.SHEPIT_KEYSTORE_PASSWORD }}
          SHEPIT_VERSION_CODE: ${{ env.VERSION_CODE }}
          SHEPIT_VERSION_NAME: ${{ env.VERSION_NAME }}
          SHEPIT_COMMIT: ${{ github.sha }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          ls app/build/outputs/apk/release/
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/shepit-$VERSION_NAME.apk"
          fi
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Відбиток сертифіката і контрольна сума
        if: steps.key.outputs.signed == 'true'
        run: |
          APK="$RUNNER_TEMP/shepit-$VERSION_NAME.apk"
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          {
            echo "### Шепіт для Android $VERSION_NAME"
            echo
            echo "Коміт: \`${GITHUB_SHA::7}\` · Android 8.0+"
            echo
            echo "SHA-256 файлу:"
            echo '```'
            sha256sum "$APK" | cut -d' ' -f1
            echo '```'
            echo "Сертифікат підпису (SHA-256):"
            echo '```'
            "$BT/apksigner" verify --print-certs "$APK" | grep 'SHA-256' | head -1 | sed 's/.*: //'
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Публікація в Releases
        if: steps.key.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.VERSION_NAME }}
          name: Шепіт для Android ${{ env.VERSION_NAME }}
          body_path: ${{ runner.temp }}/notes.md
          files: ${{ runner.temp }}/shepit-${{ env.VERSION_NAME }}.apk
          make_latest: true
