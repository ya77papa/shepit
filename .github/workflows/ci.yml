name: CI

on:
  push:
    branches: [main]
    # Зміни лише в документації не запускають збірку (економія сховища й часу).
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE', 'clients/android/**', '.github/workflows/android.yml']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE', 'clients/android/**', '.github/workflows/android.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo test -p shepit-server --features push --locked

  server-image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Не зберігати артефакт-звіт збірки (.dockerbuild) — він займає сховище Actions.
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          build-args: SHEPIT_COMMIT=${{ github.sha }}
          # Без attestation-маніфестів: кожен з них — окрема версія пакета в ghcr.io.
          provenance: false
          sbom: false
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shepit-server:latest
            ghcr.io/${{ github.repository_owner }}/shepit-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Хеш збірки веб-клієнта
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/shepit-server:${{ github.sha }}
          docker run --rm --entrypoint cat "$IMAGE" /web/version.json > version.json
          BUILD=$(jq -r .build version.json)
          echo "Хеш збірки: $BUILD"
          {
            echo "### Веб-клієнт"
            echo "- Коміт: \`${{ github.sha }}\`"
            echo "- Хеш збірки: \`$BUILD\`"
            echo "- Перевірити сервер: \`curl -s https://shepit.razom.isroot.in/version.json | jq -r .build\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Прибрати старі версії образу (лишити 5 останніх)
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: shepit-server
          package-type: container
          min-versions-to-keep: 5
