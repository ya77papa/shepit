[package]
name = "shepit-core"
description = "Ядро Шепіт: формат конвертів і пакетів ключів, E2EE на libsignal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["crypto"]
# Підписи запитів і сертифікати відправника. Потрібна і клієнту, і серверу.
auth = ["dep:libsignal-protocol", "dep:rand"]
# Наскрізне шифрування. Тільки клієнт: сервер не має чим розшифрувати повідомлення.
crypto = ["auth", "dep:async-trait", "dep:futures"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
sha2.workspace = true
libsignal-protocol = { workspace = true, optional = true }
async-trait = { version = "0.1", optional = true }
futures = { version = "0.3", default-features = false, features = ["executor"], optional = true }
rand = { version = "0.9", optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "0.3"
