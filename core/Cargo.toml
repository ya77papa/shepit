[package]
name = "shepit-core"
description = "Ядро Шепіт: формат конвертів і пакетів ключів, E2EE на libsignal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["crypto"]
# Сервер вимикає цю фічу: йому не потрібна криптографія, лише формати даних.
crypto = ["dep:libsignal-protocol", "dep:async-trait", "dep:futures", "dep:rand"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
sha2.workspace = true
libsignal-protocol = { workspace = true, optional = true }
async-trait = { version = "0.1", optional = true }
futures = { version = "0.3", default-features = false, features = ["executor"], optional = true }
rand = { version = "0.9", optional = true }
