[package]
name = "shepit-android-core"
description = "Ядро Шепіт для Android (UniFFI → Kotlin): та сама криптографія, що й у вебі"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "shepit_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
shepit-core = { workspace = true, features = ["crypto"] }
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
uniffi = "0.32"
thiserror = "2"
